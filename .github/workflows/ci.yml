name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm

      - run: npm install -g oxlint@1.79.0

      - name: OXLint
        run: oxlint .

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
